## RUSTFLAGS="-C target-feature=+simd128" wasm-pack build --release --target web
[package]
name = "hybridocr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2.99"
serde = "1.0.216"
serde-wasm-bindgen = "0.6.5"
argon2 = "0.5.3"
nalgebra = "0.33.2"

[dev-dependencies]
image = { version = "0.25.5", features = ["avif-native"] }
imageproc = "0.25.0"
hex = "0.4.3"
