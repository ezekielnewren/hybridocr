## RUSTFLAGS="-C target-feature=+simd128" wasm-pack build --release --target web
[package]
name = "hybridocr"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = { version = "0.2" }
argon2 = "0.5.3"
imageproc = "0.25.0"
image = "0.25.5"
serde = { version = "1.0.215", features = ["derive"] }

[dev-dependencies]
webp = "0.3.0"
wasm-bindgen-test = "0.3"
hex = "0.4.3"

[build-dependencies]
wasm-pack = "0.13.1"

[profile.release]
opt-level = 3
